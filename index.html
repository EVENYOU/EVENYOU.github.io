<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evenyou</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d1d1f;
        --mid: #6e6e73;
        --subtle: #f5f5f7;
        --border: #e5e5ea;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        min-height: 100vh;
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 76px;
        padding: 0 2rem;
        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }

      .nav-logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--fg);
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .nav-logo img {
        width: 52px;
        height: 52px;
        display: block;
        object-fit: contain;
      }

      .nav-logo-text {
        font-size: 1.08rem;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: var(--fg);
        text-decoration: none;
        opacity: 0.8;
        font-size: 0.86rem;
      }

      .nav-links a:hover {
        opacity: 1;
      }

      main {
        padding: 2rem;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 2rem;
        border-top: 1px solid var(--border);
      }

      .footer-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--fg);
        font-weight: 600;
      }

      .footer-brand img {
        width: 46px;
        height: 46px;
        display: block;
        object-fit: contain;
      }

      .footer-copy {
        color: var(--mid);
        font-size: 0.75rem;
      }

      @media (max-width: 700px) {
        nav {
          padding: 0 1rem;
          height: 68px;
        }

        .nav-logo img {
          width: 46px;
          height: 46px;
        }

        .nav-links {
          display: none;
        }

        footer {
          flex-direction: column;
          align-items: flex-start;
          padding: 1.5rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#" class="nav-logo" aria-label="Evenyou home">
        <img
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23111111'/%3E%3Cpath d='M38 34h18v52H38V34zm22 0h20c14 0 20 8 20 18 0 9-5 16-15 18l17 18H74l-13-16h9c6 0 10-3 10-9 0-6-4-9-10-9H60V34z' fill='%23ffffff'/%3E%3C/svg%3E"
          alt="Evenyou logo"
        />
        <span class="nav-logo-text">Evenyou</span>
      </a>

      <ul class="nav-links">
        <li><a href="#projects">Проекты</a></li>
        <li><a href="#about">О себе</a></li>
        <li><a href="#contact">Контакты</a></li>
      </ul>
    </nav>

    <main>
      <h1>Evenyou</h1>
      <p>Logo size increased for nav and footer.</p>
    </main>

    <footer>
      <div class="footer-brand">
        <img
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23111111'/%3E%3Cpath d='M38 34h18v52H38V34zm22 0h20c14 0 20 8 20 18 0 9-5 16-15 18l17 18H74l-13-16h9c6 0 10-3 10-9 0-6-4-9-10-9H60V34z' fill='%23ffffff'/%3E%3C/svg%3E"
          alt="Evenyou logo"
        />
        <span>Evenyou</span>
      </div>
      <div class="footer-copy">© 2025–2026 Evenyou</div>
    </footer>
  </body>
</html>
